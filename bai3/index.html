<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <marquee behavior="" direction="">marquee</marquee>
        <!-- danh sách thứ tự  -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
        <!-- danh sách không thứ tự -->
        <ul>
            <li>c#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul> 

        <!-- form -->
        <h1>Form Login</h1>
        <form action="">
            <div>
                <b>FullName</b> <br>
                <!-- mặc định input type = "text" -->
                 <!-- readonly chỉ đọc -->
                <input type="text" placeholder="FullName" required>
            </div>
            <div>
                <b>PassWord</b> <br>
                <input type="password" placeholder="PassWord">
            </div>
            <div>
                <b>Email</b> <br>
                <input type="email" placeholder="Email">
            </div>
            <div>
                <b>Date</b> <br>
                <input type="number" placeholder="Date">
            </div>
            <div>
                <b>NumberPhone</b> <br>
                <input type="tel" placeholder="NumberPhone" pattern="0[398][0-9]{8}">
                <input type="tel" placeholder="NumberPhone" pattern="([0]{1}([3,9,8]{1})([0-9]{8}))">
            </div>
            <div>
                <b>Text unlimited</b>
                <textarea name="" id="" placeholder="Enter information"></textarea>
            </div>
            <b>Gender</b>
            <div>
                <input type="radio" name="gender" id="" value="Male"> Male <br>
                <input type="radio" name="gender" id="" value="Female"> Female
            </div>
            <div>
                <b>You hobby :</b>
                Game<input type="checkbox" name="hobby" id="" value="Game">
                Sport<input type="checkbox" name="hobby" id="" value="Sport">
                Mussic<input type="checkbox" name="hobby" id="" value="Mussic">
            </div>
            <div>
                <b>Web mylike</b>
                <select name="Webmylike" id="">
                    <option value="CocCoc">CocCoc</option>
                    <option value="Chorm">Chorm</option>
                    <option value="Safari">Safari</option>
                    <option value="Edge">Edge</option>
                </select>
            </div>
            <div>
                <input type="range" name="" id="">
            </div>
            <input type="submit">
            <button>Button</button>
            <input type="reset" value="reset"> <br>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/MazigJqRWWU?si=JbbKKmh7gFBjA2jS" frameborder="0"></iframe>
            <video src="../video/meme.mp4" type="video/mp4" controls autoplay muted loop></video>
            <video controls autoplay muted loop width="640">
                <source src="../video/meme.mp4" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </form>
    </body> 
</html>
